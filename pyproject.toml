[project]
name = "crest-forensic"
version = "0.1.0"
description = "CREST Forensic Agent — Phase 1 data foundation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[tool.pytest.ini_options]
markers = [
    "live: hits the real RapidAPI endpoint, needs RAPIDAPI_KEY (opt-in)",
]
testpaths = ["crest_forensic/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crest_forensic*"]
